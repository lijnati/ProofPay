<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <rect width="1200" height="640" fill="#f7f7f5"/>
  <text x="60" y="64" font-size="26" font-weight="600" fill="#17181a">ProofPay architecture</text>
  <text x="60" y="94" font-size="15" fill="#74767c">AI extracts facts. Deterministic code decides. The model never sees or sets the verdict.</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#45474c"/></marker>
  </defs>

  <!-- Untrusted zone -->
  <rect x="40" y="130" width="380" height="430" rx="14" fill="#fbf1ef" stroke="#ecc9c4"/>
  <text x="60" y="160" font-size="12" font-weight="600" fill="#a8322a" letter-spacing="1.5">UNTRUSTED</text>

  <rect x="64" y="180" width="332" height="86" rx="10" fill="#fff" stroke="#e4e4df"/>
  <text x="84" y="210" font-size="16" font-weight="600" fill="#17181a">Payment request text</text>
  <text x="84" y="234" font-size="13" fill="#74767c">Email or invoice pasted by the user.</text>
  <text x="84" y="252" font-size="13" fill="#74767c">May contain prompt injection.</text>

  <rect x="64" y="300" width="332" height="118" rx="10" fill="#fff" stroke="#e4e4df"/>
  <text x="84" y="330" font-size="16" font-weight="600" fill="#17181a">AI extraction</text>
  <text x="84" y="354" font-size="13" fill="#74767c">generateText + Output.object (AI SDK 7)</text>
  <text x="84" y="372" font-size="13" fill="#74767c">via Vercel AI Gateway · openai/gpt-5-mini</text>
  <text x="84" y="396" font-size="13" fill="#45474c">Fields + verbatim excerpts only.</text>
  <text x="84" y="412" font-size="13" fill="#45474c">No verdict, risk, or reference fields.</text>

  <rect x="64" y="452" width="332" height="84" rx="10" fill="#fff" stroke="#e4e4df"/>
  <text x="84" y="482" font-size="16" font-weight="600" fill="#17181a">Zod schema validation</text>
  <text x="84" y="506" font-size="13" fill="#74767c">Invalid output → error, never a result.</text>
  <text x="84" y="524" font-size="13" fill="#74767c">Errors and timeouts never release payment.</text>

  <path d="M230 266 V296" stroke="#45474c" stroke-width="2" marker-end="url(#a)"/>
  <path d="M230 418 V448" stroke="#45474c" stroke-width="2" marker-end="url(#a)"/>

  <!-- Deterministic zone -->
  <rect x="460" y="130" width="700" height="430" rx="14" fill="#f0f6f2" stroke="#c5ddcf"/>
  <text x="480" y="160" font-size="12" font-weight="600" fill="#2f6f4f" letter-spacing="1.5">DETERMINISTIC · PURE TYPESCRIPT · NO AI</text>

  <rect x="484" y="180" width="310" height="118" rx="10" fill="#fff" stroke="#e4e4df"/>
  <text x="504" y="210" font-size="16" font-weight="600" fill="#17181a">Evidence grounding</text>
  <text x="504" y="234" font-size="13" fill="#74767c">Excerpt must occur in the source.</text>
  <text x="504" y="252" font-size="13" fill="#74767c">Value must be a whole token in it.</text>
  <text x="504" y="270" font-size="13" fill="#74767c">Payee must be an explicitly labeled value.</text>
  <text x="504" y="288" font-size="13" fill="#45474c">Unsupported claims → discarded.</text>

  <rect x="826" y="180" width="310" height="118" rx="10" fill="#fff" stroke="#e4e4df"/>
  <text x="846" y="210" font-size="16" font-weight="600" fill="#17181a">Text scan (independent of AI)</text>
  <text x="846" y="234" font-size="13" fill="#74767c">Account identifiers in the text</text>
  <text x="846" y="252" font-size="13" fill="#74767c">Registered supplier names</text>
  <text x="846" y="270" font-size="13" fill="#74767c">Injection, payment-change, urgency</text>
  <text x="846" y="288" font-size="13" fill="#74767c">Sender header domains</text>

  <rect x="484" y="330" width="652" height="104" rx="10" fill="#fff" stroke="#e4e4df"/>
  <text x="504" y="360" font-size="16" font-weight="600" fill="#17181a">Rules vs. trusted supplier registry</text>
  <text x="504" y="384" font-size="13" fill="#74767c">Supplier by registered name/alias (unique) · account · beneficiary · sender domain (lookalikes)</text>
  <text x="504" y="402" font-size="13" fill="#74767c">bank · currency · amount (decimal strings) · multiple destinations · missing fields</text>
  <text x="504" y="422" font-size="13" fill="#45474c">Every finding carries the quoted request value and the trusted reference value.</text>

  <rect x="484" y="460" width="652" height="76" rx="10" fill="#17181a"/>
  <text x="504" y="490" font-size="16" font-weight="600" fill="#fff">Verdict</text>
  <text x="504" y="516" font-size="14" fill="#d3d3cc">any critical → <tspan fill="#f2a59c" font-weight="600">HOLD</tspan>   ·   any warning → <tspan fill="#f1c77a" font-weight="600">REVIEW</tspan>   ·   otherwise → <tspan fill="#9fd3b6" font-weight="600">NO MISMATCH vs. registered records</tspan></text>

  <path d="M396 520 H440 V240 H478" fill="none" stroke="#45474c" stroke-width="2" marker-end="url(#a)"/>
  <path d="M420 223 H440" stroke="#45474c" stroke-width="2"/>
  <path d="M396 223 H440 V116 H981 V176" fill="none" stroke="#45474c" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <path d="M639 298 V326" stroke="#45474c" stroke-width="2" marker-end="url(#a)"/>
  <path d="M981 298 V326" stroke="#45474c" stroke-width="2" marker-end="url(#a)"/>
  <path d="M810 434 V456" stroke="#45474c" stroke-width="2" marker-end="url(#a)"/>

  <rect x="826" y="566" width="310" height="0" fill="none"/>
  <text x="60" y="600" font-size="13" fill="#74767c">Dashed: the raw request text also goes straight to the deterministic scan, bypassing the AI entirely.</text>
  <text x="60" y="620" font-size="13" fill="#74767c">Trusted registry = synthetic fixtures (src/fixtures/suppliers.ts). Nothing is stored; no real payments.</text>
</svg>
